<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IIIF to PDF Converter</title>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 480px; }
    h2 { margin-top: 0; color: #38bdf8; }
    label { display: block; margin-bottom: 0.5rem; color: #94a3b8; }
    input { width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; margin-bottom: 1rem; }
    button { width: 100%; padding: 0.75rem; border: none; border-radius: 6px; background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin-top: 1rem; font-size: 0.9rem; color: #94a3b8; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h2>IIIF Manifest to PDF</h2>
    
    <label for="manifestUrl">Manifest URL</label>
    <input type="url" id="manifestUrl" placeholder="https://example.org/iiif/manifest.json" required />

    <label for="outputFilename">Custom File Name (Optional)</label>
    <input type="text" id="outputFilename" placeholder="my-custom-document" />

    <button id="btn" onclick="convert()">Generate PDF</button>
    <div id="status"></div>
  </div>

  <script>
    const delay = ms => new Promise(res => setTimeout(res, ms));

    function getValidIIIFImageUrl(canvas) {
      // 1. Extract body object (supports IIIF v2 & v3)
      const body = canvas.items?.[0]?.items?.[0]?.body || canvas.images?.[0]?.resource;
      if (!body) return null;

      // 2. Locate service array or object
      const service = body.service || body.services;
      let serviceId = null;

      if (service) {
        const svc = Array.isArray(service) ? service[0] : service;
        serviceId = svc.id || svc['@id'];
      }

      // If a valid IIIF Image Service exists, construct the standardized IIIF v3 / v2 image path
      if (serviceId) {
        const cleanService = serviceId.replace(/\/info\.json$/, '').replace(/\/$/, '');
        // Using 'max' for v3, fallback URL pattern
        return `${cleanService}/full/max/0/default.jpg`;
      }

      // 3. Fallback to body.id if no service block exists
      return body.id || body['@id'];
    }

    async function convert() {
      const url = document.getElementById('manifestUrl').value.trim();
      const customName = document.getElementById('outputFilename').value.trim();
      const status = document.getElementById('status');
      const btn = document.getElementById('btn');
      
      if (!url) return alert('Please enter a IIIF Manifest URL');

      btn.disabled = true;
      status.innerText = 'Fetching manifest...';

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
        const manifest = await res.json();

        const canvases = manifest.items || manifest.sequences?.[0]?.canvases || [];
        if (!canvases.length) throw new Error('No canvases found in manifest.');

        const pdfDoc = await PDFLib.PDFDocument.create();
        let successCount = 0;

        for (let i = 0; i < canvases.length; i++) {
          status.innerText = `Processing page ${i + 1} of ${canvases.length}...`;
          const canvas = canvases[i];
          let imgUrl = getValidIIIFImageUrl(canvas);

          if (!imgUrl) {
            console.warn(`Page ${i + 1}: Could not construct image URL`);
            continue;
          }

          if (i > 0) await delay(300); // Prevent request spamming

          try {
            let imgRes = await fetch(imgUrl);

            // Fallback strategy: If /full/max/ returns 403/404, try /full/full/
            if (!imgRes.ok && imgUrl.includes('/full/max/')) {
              imgUrl = imgUrl.replace('/full/max/', '/full/full/');
              imgRes = await fetch(imgUrl);
            }

            if (!imgRes.ok) {
              console.warn(`Skipping page ${i + 1}: HTTP ${imgRes.status}`);
              continue;
            }

            const imgBytes = await imgRes.arrayBuffer();
            
            let image;
            try {
              image = await pdfDoc.embedJpg(imgBytes);
            } catch {
              image = await pdfDoc.embedPng(imgBytes);
            }

            const page = pdfDoc.addPage([image.width, image.height]);
            page.drawImage(image, { x: 0, y: 0, width: image.width, height: image.height });
            successCount++;

          } catch (pageErr) {
            console.warn(`Error on page ${i + 1}:`, pageErr);
          }
        }

        if (successCount === 0) throw new Error('Failed to load any page images from the manifest.');

        status.innerText = `Compiling PDF (${successCount}/${canvases.length} pages)...`;
        const pdfBytes = await pdfDoc.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);

        let fileName = customName || manifest.label?.en?.[0] || manifest.label || 'iiif-document';
        if (typeof fileName === 'object') fileName = 'iiif-document';
        if (!fileName.toLowerCase().endsWith('.pdf')) fileName += '.pdf';

        a.download = fileName;
        a.click();

        status.innerText = `Done! Successfully converted ${successCount} of ${canvases.length} pages.`;
      } catch (err) {
        status.innerText = 'Error: ' + err.message;
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
